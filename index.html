<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Dodge — Finger Tracker Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; background: #000;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden;
  }
  #stage {
    position: relative; width: 1280px; height: 720px; margin: 0 auto;
    background: rgb(8,8,18);
  }
  #gameCanvas { position: absolute; top: 0; left: 0; }
  #video { display: none; }

  #loadingScreen {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgb(8,8,18);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #e6e6ff; z-index: 50; text-align: center;
  }
  #loadingScreen h1 { color: rgb(60,170,255); font-size: 42px; margin-bottom: 10px; }
  #loadingScreen p { color: #9a9ac0; max-width: 640px; line-height: 1.5; margin-bottom: 10px; }
  #startBtn {
    margin-top: 20px; padding: 14px 34px; font-size: 18px; font-weight: bold;
    background: rgb(60,170,255); color: #06121c; border: none; border-radius: 8px;
    cursor: pointer;
  }
  #startBtn:disabled { background: #555; cursor: not-allowed; }
  #errorBox { color: rgb(255,60,90); margin-top: 14px; max-width: 640px; display: none; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <video id="video" playsinline></video>

  <div id="loadingScreen">
    <h1>NEON DODGE</h1>
    <p>Finger Tracker Edition — move your INDEX FINGER in front of the webcam to
    control the glowing blue orb. Collect green orbs, avoid red enemies.</p>
    <button id="startBtn">Enable Camera &amp; Start</button>
    <div id="errorBox"></div>
  </div>
</div>

<!-- MediaPipe Hands, loaded from CDN — no install required -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
"use strict";

/* ============================================================
   CONFIGURATION  (ported 1:1 from the Python neon_dodge.py)
   ============================================================ */
const SCREEN_W = 1280, SCREEN_H = 720;

const PLAYER_RADIUS = 18;
const ORB_RADIUS = 16;
const ENEMY_MIN_RADIUS = 14, ENEMY_MAX_RADIUS = 26;

const COLOR_BG = "rgb(8,8,18)";
const COLOR_PLAYER = "rgb(60,170,255)";
const COLOR_PLAYER_GLOW = "rgb(30,90,160)";
const COLOR_ORB = "rgb(60,255,140)";
const COLOR_ORB_GLOW = "rgb(20,120,70)";
const COLOR_ENEMY = "rgb(255,60,90)";
const COLOR_ENEMY_GLOW = "rgb(150,20,40)";
const COLOR_TEXT = "rgb(230,230,255)";
const COLOR_ACCENT = "rgb(255,210,60)";

const HIGH_SCORE_KEY = "neonDodgeHighScore";

const BASE_ENEMY_SPEED = 2.2, MAX_ENEMY_SPEED = 9.0;
const BASE_SPAWN_INTERVAL = 1.6, MIN_SPAWN_INTERVAL = 0.35;
const DIFFICULTY_SCORE_CAP = 20;

const SMOOTHING = 0.35;

/* ============================================================
   UTILITIES
   ============================================================ */
function loadHighScore() { return parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "0", 10); }
function saveHighScore(v) { localStorage.setItem(HIGH_SCORE_KEY, String(v)); }
function pointCircleCollision(px, py, cx, cy, radius) { return Math.hypot(px - cx, py - cy) <= radius; }

function drawGlowCircle(ctx, color, glowColor, x, y, radius, glowLayers = 4) {
  for (let i = glowLayers; i > 0; i--) {
    const gr = radius + i * 6;
    ctx.globalAlpha = (40 / i) / 255;
    ctx.fillStyle = glowColor;
    ctx.beginPath();
    ctx.arc(x, y, gr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x, y, Math.max(2, Math.floor(radius / 4)), 0, Math.PI * 2);
  ctx.fill();
}

function drawGlowTriangle(ctx, color, glowColor, x, y, size, angle, glowLayers = 3) {
  function trianglePoints(expand) {
    const pts = [];
    for (let i = 0; i < 3; i++) {
      const theta = angle + i * (2 * Math.PI / 3);
      const px = x + Math.cos(theta) * (size + expand);
      const py = y + Math.sin(theta) * (size + expand);
      pts.push([px, py]);
    }
    return pts;
  }
  for (let i = glowLayers; i > 0; i--) {
    ctx.globalAlpha = (35 / i) / 255;
    ctx.fillStyle = glowColor;
    const pts = trianglePoints(i * 5);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.lineTo(pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  const pts = trianglePoints(0);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  ctx.lineTo(pts[1][0], pts[1][1]);
  ctx.lineTo(pts[2][0], pts[2][1]);
  ctx.closePath();
  ctx.fill();
}

/* ============================================================
   GAME OBJECTS
   ============================================================ */
class Orb {
  constructor() { this.respawn(); }
  respawn() {
    const margin = 80;
    this.x = margin + Math.random() * (SCREEN_W - margin * 2);
    this.y = (margin + 70) + Math.random() * (SCREEN_H - margin - (margin + 70));
    this.pulseTimer = Math.random() * Math.PI * 2;
  }
  update(dt) { this.pulseTimer += dt * 4; }
  draw(ctx) {
    const pulse = 1.0 + 0.15 * Math.sin(this.pulseTimer);
    drawGlowCircle(ctx, COLOR_ORB, COLOR_ORB_GLOW, this.x, this.y, ORB_RADIUS * pulse);
  }
}

class Enemy {
  constructor(speed) {
    this.radius = ENEMY_MIN_RADIUS + Math.random() * (ENEMY_MAX_RADIUS - ENEMY_MIN_RADIUS);
    const edge = ["top", "bottom", "left", "right"][Math.floor(Math.random() * 4)];
    if (edge === "top") { this.x = Math.random() * SCREEN_W; this.y = -this.radius; }
    else if (edge === "bottom") { this.x = Math.random() * SCREEN_W; this.y = SCREEN_H + this.radius; }
    else if (edge === "left") { this.x = -this.radius; this.y = 80 + Math.random() * (SCREEN_H - 80); }
    else { this.x = SCREEN_W + this.radius; this.y = 80 + Math.random() * (SCREEN_H - 80); }

    const targetX = SCREEN_W * 0.2 + Math.random() * (SCREEN_W * 0.6);
    const targetY = SCREEN_H * 0.2 + Math.random() * (SCREEN_H * 0.6);
    const dx = targetX - this.x, dy = targetY - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.vx = dx / dist * speed;
    this.vy = dy / dist * speed;
    this.angle = Math.atan2(dy, dx);
  }
  update(dt) { this.x += this.vx * dt * 60; this.y += this.vy * dt * 60; }
  offScreen() {
    const pad = 100;
    return this.x < -pad || this.x > SCREEN_W + pad || this.y < -pad || this.y > SCREEN_H + pad;
  }
  draw(ctx) { drawGlowTriangle(ctx, COLOR_ENEMY, COLOR_ENEMY_GLOW, this.x, this.y, this.radius, this.angle); }
}

/* ============================================================
   HAND TRACKING STATE
   ============================================================ */
const handState = {
  visible: false,
  smoothedX: SCREEN_W / 2,
  smoothedY: SCREEN_H / 2,
  isOpenPalm: false,
  holdStillSeconds: 0,
  lastLandmarks: null,
};
let stillStartTime = null;
let lastStillPos = null;
let lastVideoFrameForPreview = null;

function processHandResults(results) {
  const video = document.getElementById("video");
  lastVideoFrameForPreview = video;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handState.visible = true;
    const lm = results.multiHandLandmarks[0];
    handState.lastLandmarks = lm;

    const indexTip = lm[8];
    const mirroredX = 1 - indexTip.x; // mirror for natural movement
    const rawX = mirroredX * SCREEN_W;
    const rawY = indexTip.y * SCREEN_H;

    handState.smoothedX += (rawX - handState.smoothedX) * SMOOTHING;
    handState.smoothedY += (rawY - handState.smoothedY) * SMOOTHING;

    // --- Open palm detection (all 4 fingers extended above their PIP joints) ---
    const tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
    let extended = 0;
    for (let i = 0; i < 4; i++) { if (lm[tips[i]].y < lm[pips[i]].y) extended++; }
    handState.isOpenPalm = extended >= 3;

    // --- Track how long the hand has stayed roughly still while open ---
    const now = performance.now() / 1000;
    if (handState.isOpenPalm) {
      const cur = { x: rawX, y: rawY };
      if (lastStillPos) {
        const dist = Math.hypot(cur.x - lastStillPos.x, cur.y - lastStillPos.y);
        if (dist < 40) {
          if (stillStartTime === null) stillStartTime = now;
          handState.holdStillSeconds = now - stillStartTime;
        } else { stillStartTime = now; handState.holdStillSeconds = 0; }
      } else { stillStartTime = now; }
      lastStillPos = cur;
    } else {
      stillStartTime = null; lastStillPos = null; handState.holdStillSeconds = 0;
    }
  } else {
    handState.visible = false;
    handState.lastLandmarks = null;
    stillStartTime = null; lastStillPos = null; handState.holdStillSeconds = 0;
  }
}

/* ============================================================
   MAIN GAME
   ============================================================ */
class Game {
  constructor(ctx) {
    this.ctx = ctx;
    this.highScore = loadHighScore();
    this.audioCtx = null;
    this.reset();
  }

  ensureAudio() {
    if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  beep(freq, durationMs, volume) {
    this.ensureAudio();
    const ctx = this.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationMs / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + durationMs / 1000);
  }

  reset() {
    this.score = 0;
    this.playerX = SCREEN_W / 2;
    this.playerY = SCREEN_H / 2;
    this.orb = new Orb();
    this.enemies = [];
    this.gameOver = false;
    this.timeSinceLastSpawn = 0;
    this.flashTimer = 0;
  }

  currentDifficultyT() { return Math.min(this.score / DIFFICULTY_SCORE_CAP, 1.0); }
  currentEnemySpeed() {
    const t = Math.pow(this.currentDifficultyT(), 1.5);
    return BASE_ENEMY_SPEED + (MAX_ENEMY_SPEED - BASE_ENEMY_SPEED) * t;
  }
  currentSpawnInterval() {
    const t = Math.pow(this.currentDifficultyT(), 1.5);
    return BASE_SPAWN_INTERVAL - (BASE_SPAWN_INTERVAL - MIN_SPAWN_INTERVAL) * t;
  }
  enemiesPerSpawn() {
    if (this.score < DIFFICULTY_SCORE_CAP) return 1;
    const extra = Math.floor((this.score - DIFFICULTY_SCORE_CAP) / 15);
    return 1 + Math.min(extra, 3);
  }

  update(dt, fx, fy, handVisible) {
    if (handVisible) { this.playerX = fx; this.playerY = fy; }
    if (this.gameOver) return;

    this.orb.update(dt);
    if (pointCircleCollision(this.playerX, this.playerY, this.orb.x, this.orb.y, PLAYER_RADIUS + ORB_RADIUS)) {
      this.score += 1;
      this.flashTimer = 0.15;
      this.beep(880, 120, 0.2);
      this.orb.respawn();
    }

    this.timeSinceLastSpawn += dt;
    if (this.timeSinceLastSpawn >= this.currentSpawnInterval()) {
      this.timeSinceLastSpawn = 0;
      for (let i = 0; i < this.enemiesPerSpawn(); i++) {
        this.enemies.push(new Enemy(this.currentEnemySpeed()));
      }
    }

    for (const enemy of this.enemies) {
      enemy.update(dt);
      if (pointCircleCollision(this.playerX, this.playerY, enemy.x, enemy.y, PLAYER_RADIUS + enemy.radius - 6)) {
        this.triggerGameOver();
        break;
      }
    }
    this.enemies = this.enemies.filter(e => !e.offScreen());

    if (this.flashTimer > 0) this.flashTimer -= dt;
  }

  triggerGameOver() {
    this.gameOver = true;
    if (this.score > this.highScore) { this.highScore = this.score; saveHighScore(this.highScore); }
  }

  drawUI() {
    const ctx = this.ctx;
    ctx.fillStyle = COLOR_TEXT;
    ctx.font = "bold 40px Arial";
    ctx.fillText(`Score: ${this.score}`, 30, 55);

    ctx.fillStyle = COLOR_ACCENT;
    ctx.font = "26px Arial";
    ctx.fillText(`All-Time High: ${this.highScore}`, 30, 90);

    const t = this.currentDifficultyT();
    const barW = 220, barH = 10, barX = SCREEN_W - barW - 30, barY = 30;
    ctx.fillStyle = "rgb(50,50,70)";
    roundRect(ctx, barX, barY, barW, barH, 5); ctx.fill();
    ctx.fillStyle = COLOR_ENEMY;
    roundRect(ctx, barX, barY, barW * t, barH, 5); ctx.fill();
    ctx.fillStyle = "rgb(150,150,180)";
    ctx.font = "16px Arial";
    ctx.fillText("Intensity", barX, barY - 8);

    if (!handState.visible) {
      ctx.fillStyle = "rgb(255,180,60)";
      ctx.font = "20px Arial";
      const msg = "Show your hand to the camera";
      const w = ctx.measureText(msg).width;
      ctx.fillText(msg, SCREEN_W / 2 - w / 2, SCREEN_H - 40);
    }

    this.drawCameraPreview();
  }

  drawCameraPreview() {
    const ctx = this.ctx;
    const previewW = 400, previewH = 300;
    const margin = 20;
    const px = SCREEN_W - previewW - margin;
    const py = margin + 60;

    ctx.fillStyle = "#000000";
    ctx.fillRect(px - 4, py - 4, previewW + 8, previewH + 8);

    if (lastVideoFrameForPreview && lastVideoFrameForPreview.videoWidth > 0) {
      // Mirror the drawn video to match the mirrored coordinate mapping
      ctx.save();
      ctx.translate(px + previewW, py);
      ctx.scale(-1, 1);
      ctx.drawImage(lastVideoFrameForPreview, 0, 0, previewW, previewH);
      ctx.restore();

      if (handState.visible && handState.lastLandmarks) {
        // drawConnectors/drawLandmarks multiply landmark coords by ctx.canvas.width/height
        // (the full 1280x720 game canvas), so we scale down by previewW/SCREEN_W and
        // previewH/SCREEN_H to land them correctly inside the smaller preview box.
        const scaleX = previewW / SCREEN_W, scaleY = previewH / SCREEN_H;
        ctx.save();
        ctx.translate(px + previewW, py);
        ctx.scale(-scaleX, scaleY);
        drawConnectors(ctx, handState.lastLandmarks, HAND_CONNECTIONS,
          { color: "#3ec8ff", lineWidth: 2 / scaleX });
        drawLandmarks(ctx, handState.lastLandmarks,
          { color: "#ffd23c", radius: 2 / scaleX, lineWidth: 1 / scaleX });
        ctx.restore();
      }
    }

    const borderColor = handState.visible ? COLOR_ORB : COLOR_ENEMY;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 3;
    ctx.strokeRect(px - 4, py - 4, previewW + 8, previewH + 8);

    ctx.fillStyle = borderColor;
    ctx.font = "20px Arial";
    ctx.fillText(handState.visible ? "Camera (hand detected)" : "Camera (no hand)", px, py - 10);
  }

  drawGameOver() {
    const ctx = this.ctx;
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    ctx.fillStyle = COLOR_ENEMY;
    ctx.font = "bold 90px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", SCREEN_W / 2, SCREEN_H / 2 - 100);

    ctx.fillStyle = COLOR_TEXT;
    ctx.font = "bold 40px Arial";
    ctx.fillText(`Final Score: ${this.score}`, SCREEN_W / 2, SCREEN_H / 2 - 20);

    if (this.score >= this.highScore && this.score > 0) {
      ctx.fillStyle = COLOR_ACCENT;
      ctx.font = "26px Arial";
      ctx.fillText("NEW HIGH SCORE!", SCREEN_W / 2, SCREEN_H / 2 + 20);
    }

    ctx.fillStyle = COLOR_TEXT;
    ctx.font = "24px Arial";
    ctx.fillText("Hold hand open & still for 2s to restart, or press SPACE", SCREEN_W / 2, SCREEN_H / 2 + 80);

    const progress = Math.min(handState.holdStillSeconds / 2.0, 1);
    const barW = 300, barX = SCREEN_W / 2 - barW / 2, barY = SCREEN_H / 2 + 110;
    ctx.fillStyle = "rgb(60,60,80)";
    roundRect(ctx, barX, barY, barW, 14, 7); ctx.fill();
    ctx.fillStyle = COLOR_ORB;
    roundRect(ctx, barX, barY, barW * progress, 14, 7); ctx.fill();

    ctx.textAlign = "left";
    this.drawCameraPreview();
  }

  draw() {
    const ctx = this.ctx;
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    // Subtle grid background
    ctx.strokeStyle = "rgb(20,20,35)";
    ctx.lineWidth = 1;
    for (let x = 0; x < SCREEN_W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SCREEN_H); ctx.stroke(); }
    for (let y = 0; y < SCREEN_H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(SCREEN_W, y); ctx.stroke(); }

    if (!this.gameOver) {
      this.orb.draw(ctx);
      for (const e of this.enemies) e.draw(ctx);
      drawGlowCircle(ctx, COLOR_PLAYER, COLOR_PLAYER_GLOW, this.playerX, this.playerY, PLAYER_RADIUS);

      if (this.flashTimer > 0) {
        ctx.globalAlpha = (120 / 255) * (this.flashTimer / 0.15);
        ctx.fillStyle = COLOR_ORB;
        ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        ctx.globalAlpha = 1;
      }

      this.drawUI();
    } else {
      this.orb.draw(ctx);
      for (const e of this.enemies) e.draw(ctx);
      drawGlowCircle(ctx, COLOR_PLAYER, COLOR_PLAYER_GLOW, this.playerX, this.playerY, PLAYER_RADIUS);
      this.drawGameOver();
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
let game = null;
let lastFrameTime = null;

function gameLoop(timestamp) {
  if (lastFrameTime === null) lastFrameTime = timestamp;
  const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;

  game.update(dt, handState.smoothedX, handState.smoothedY, handState.visible);
  if (game.gameOver && handState.holdStillSeconds >= 2.0) game.reset();
  game.draw();

  requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown", (e) => {
  if (!game) return;
  if ((e.code === "Space" || e.code === "KeyR") && game.gameOver) game.reset();
});

document.getElementById("startBtn").addEventListener("click", async () => {
  const btn = document.getElementById("startBtn");
  const errBox = document.getElementById("errorBox");
  btn.disabled = true;
  btn.textContent = "Starting camera...";

  try {
    const video = document.getElementById("video");

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(processHandResults);

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640, height: 480,
    });
    await camera.start();

    document.getElementById("loadingScreen").style.display = "none";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    game = new Game(ctx);

    requestAnimationFrame(gameLoop);
  } catch (err) {
    errBox.style.display = "block";
    errBox.textContent = "Camera access failed: " + err.message +
      ". Make sure you allowed camera permission and are serving this page via http:// (not file://).";
    btn.disabled = false;
    btn.textContent = "Try Again";
  }
});
</script>
</body>
</html>
